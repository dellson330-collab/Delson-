# Full nginx config (mounted at /etc/nginx/nginx.conf) for the Base44 sandbox.
#
# Runs as root because the bind-mounted repository directory is mode 700 owned
# by root, so an unprivileged worker cannot read it. This only serves local
# static files read-only.
#
# "/" resolves to the app page "Meus Atalhos.html" because the file has a space
# in its name and is not called index.html.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /srv/site;
        index "Meus Atalhos.html";

        # Always revalidate so edits to the HTML show up on reload.
        add_header Cache-Control "no-store";

        # Never serve repository metadata (e.g. .git, .base44).
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
