# Base44 sandbox environment for "Meus Atalhos".
#
# The app is a single static HTML page (plus the Android source zip) with no
# build step and no backend, so nginx serves the repository directly from a
# bind mount: editing "Meus Atalhos.html" is visible on the next page load.

name: meus-atalhos

services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/srv/site:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      base44.project: "Meus Atalhos"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
